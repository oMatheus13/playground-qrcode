<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playground QR Code Definitivo</title>
  <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0/lib/qr-code-styling.js"></script>
  <style>
    :root {
      --bg-color: #0f1117;
      --surface-color: #1a1d26;
      --surface-color-subtle: #232734;
      --primary-text-color: #f0f2f5;
      --secondary-text-color: #9ba3b4;
      --border-color: #2e3446;
      --border-color-focus: #3b82f6;
      --input-bg-color: #232734;
      --button-primary-bg: #2563eb;
      --button-primary-hover: #1d4ed8;
      --button-secondary-bg: #374151;
      --button-secondary-hover: #4b5563;
      --button-danger-bg: #dc2626;
      --button-danger-hover: #b91c1c;
      --info-bg-color: #232734;
      --success-color: #10b981;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", sans-serif;
      background-color: var(--bg-color);
      color: var(--primary-text-color);
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .qr-playground {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 32px;
      background-color: var(--surface-color);
      padding: 32px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      width: 100%;
      max-width: 1120px;
      min-height: 680px;
    }

    @media (max-width: 900px) {
      .qr-playground {
        grid-template-columns: 1fr;
        height: auto;
      }
    }

    .qr-playground__column {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 12px 0;
      color: var(--primary-text-color);
      letter-spacing: -0.02em;
    }

    .controls-wrapper {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .qr-playground__preview-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px 16px;
      background-color: var(--surface-color-subtle);
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .qr-playground__canvas {
      width: 256px;
      height: 256px;
      background-color: #ffffff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .control {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control--row {
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    .control--column {
      flex: 1;
    }

    .control__label {
      font-size: 13px;
      font-weight: 500;
      color: var(--secondary-text-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .control__label span {
      font-size: 12px;
      color: #718096;
      font-weight: 400;
    }

    .control__input {
      width: 100%;
      height: 40px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--input-bg-color);
      color: var(--primary-text-color);
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .control__input:focus {
      outline: none;
      border-color: var(--border-color-focus);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .control__input:disabled {
      background-color: #1e212b;
      color: #6b7280;
      cursor: not-allowed;
    }

    .control__input[type="color"] {
      padding: 2px 4px;
      cursor: pointer;
    }

    .control__input[type="range"] {
      padding: 0;
      cursor: pointer;
      accent-color: var(--button-primary-bg);
    }

    .control__input[type="file"] {
      padding: 6px;
      font-size: 13px;
    }

    .color-preset {
      height: 40px;
      padding: 0 12px;
      font-size: 12px;
      font-weight: 500;
      background-color: var(--surface-color-subtle);
      border: 1px solid var(--border-color);
      color: var(--secondary-text-color);
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
      white-space: nowrap;
    }

    .color-preset:hover {
      background-color: #2d3345;
      color: var(--primary-text-color);
    }

    .logo-file-wrapper {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .logo-clear-btn {
      height: 40px;
      padding: 0 12px;
      background-color: var(--surface-color-subtle);
      border: 1px solid var(--border-color);
      color: var(--secondary-text-color);
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      transition: background-color 0.2s, color 0.2s;
      white-space: nowrap;
    }

    .logo-clear-btn:hover {
      background-color: #3b2226;
      color: #f87171;
      border-color: #7f1d1d;
    }

    .info-box {
      font-size: 12px;
      font-weight: 500;
      color: var(--secondary-text-color);
      padding: 8px 14px;
      background-color: var(--info-bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      text-align: center;
    }

    .button-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .button-group--secondary {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .button {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid transparent;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .button:active {
      transform: scale(0.98);
    }

    .button--primary {
      background-color: var(--button-primary-bg);
      color: #ffffff;
    }

    .button--primary:hover {
      background-color: var(--button-primary-hover);
    }

    .button--secondary {
      background-color: var(--button-secondary-bg);
      color: #ffffff;
    }

    .button--secondary:hover {
      background-color: var(--button-secondary-hover);
    }

    .button--outline {
      background-color: transparent;
      border-color: var(--border-color);
      color: var(--secondary-text-color);
      font-size: 13px;
    }

    .button--outline:hover {
      background-color: var(--surface-color-subtle);
      color: var(--primary-text-color);
      border-color: #4b5563;
    }

    .button--danger {
      background-color: var(--button-danger-bg);
      color: #ffffff;
    }

    .button--danger:hover {
      background-color: var(--button-danger-hover);
    }

    .footer-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #downloadHtmlButton {
      background: none;
      border: none;
      color: var(--secondary-text-color);
      font-size: 12px;
      text-decoration: underline;
      cursor: pointer;
      padding: 4px;
      align-self: center;
      transition: color 0.2s;
    }

    #downloadHtmlButton:hover {
      color: var(--primary-text-color);
    }

    /* Feedback Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background-color: #1e293b;
      color: #f8fafc;
      padding: 12px 20px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
      z-index: 1000;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast--success {
      border-left: 4px solid var(--success-color);
    }
  </style>
</head>
<body>

  <main class="qr-playground">
    <!-- Coluna de Conteúdo e Preview -->
    <div class="qr-playground__column qr-playground__column--preview">
      <div>
        <h2 class="section-title">Playground QR Code</h2>
        <div class="controls-wrapper">
          <div class="control">
            <label for="fileName" class="control__label">Nome do arquivo de saída</label>
            <input type="text" id="fileName" class="control__input" placeholder="ex: meu-qrcode-evento">
          </div>

          <div class="control">
            <label for="qrData" class="control__label">Conteúdo do QR Code (URL ou Texto)</label>
            <input type="text" id="qrData" class="control__input" placeholder="https://seusite.com">
          </div>
        </div>
      </div>

      <div class="qr-playground__preview-area">
        <div id="canvas" class="qr-playground__canvas"></div>
        <div class="info-box" id="infoBox">Módulos: -- | Tamanho: -- px</div>
      </div>

      <div class="button-group--secondary">
        <button id="copyPNG" class="button button--outline">📋 Copiar PNG</button>
        <button id="copySVG" class="button button--outline">📋 Copiar SVG</button>
      </div>
    </div>

    <!-- Coluna de Controles de Personalização -->
    <div class="qr-playground__column">
      <div class="controls-wrapper">
        <h2 class="section-title">Personalização</h2>

        <div class="control--row">
          <div class="control--column">
            <label for="marginModules" class="control__label">Margem Externa (módulos)</label>
            <input type="number" id="marginModules" class="control__input" value="2" min="0" title="Espaço em branco ao redor. Cada módulo = 8px.">
          </div>
          <div class="control--column">
            <label for="errorCorrection" class="control__label">Correção de Erro</label>
            <select id="errorCorrection" class="control__input" title="Níveis mais altos (Q, H) permitem leitura mesmo com código danificado ou com logo.">
              <option value="L">Baixa (L)</option>
              <option value="M" selected>Média (M)</option>
              <option value="Q">Alta (Q)</option>
              <option value="H">Máxima (H)</option>
            </select>
          </div>
        </div>

        <div class="control--row">
          <div class="control--column">
            <label for="dotType" class="control__label">Formato dos Módulos</label>
            <select id="dotType" class="control__input">
              <option value="square">Quadrado</option>
              <option value="dots">Pontos</option>
              <option value="rounded">Arredondado</option>
              <option value="classy-rounded">Classy Arredondado</option>
              <option value="extra-rounded">Extra Arredondado</option>
            </select>
          </div>
          <div class="control--column">
            <label for="cornerSquareType" class="control__label">Formato dos Cantos (Olhos)</label>
            <select id="cornerSquareType" class="control__input">
              <option value="square">Quadrado</option>
              <option value="dot">Ponto</option>
              <option value="extra-rounded">Extra Arredondado</option>
            </select>
          </div>
        </div>

        <div class="control--row">
          <div class="control--column">
            <label class="control__label">Cor Módulos</label>
            <div class="control--row">
              <input type="color" id="dotColor" class="control__input" value="#000000" title="Seletor de cor">
              <input type="text" id="dotColorHex" class="control__input" value="#000000" placeholder="#000000" maxlength="7">
              <button type="button" class="color-preset" onclick="resetColor('dotColor', '#000000')">Padrão</button>
            </div>
          </div>
          <div class="control--column">
            <label class="control__label">Cor Fundo</label>
            <div class="control--row">
              <input type="color" id="bgColor" class="control__input" value="#ffffff" title="Seletor de cor de fundo">
              <input type="text" id="bgColorHex" class="control__input" value="#ffffff" placeholder="#ffffff" maxlength="7">
              <button type="button" class="color-preset" onclick="resetColor('bgColor', '#ffffff')">Padrão</button>
            </div>
          </div>
        </div>

        <div class="control">
          <label for="logoInput" class="control__label">Logo Central (Opcional)</label>
          <div class="logo-file-wrapper">
            <input type="file" id="logoInput" class="control__input" accept="image/png, image/jpeg, image/svg+xml">
            <button type="button" id="clearLogoBtn" class="logo-clear-btn" title="Remover logo selecionado">Remover</button>
          </div>
        </div>

        <div class="control--row" id="logoOptions">
          <div class="control--column">
            <label for="logoSize" class="control__label">Tamanho Logo <span id="logoSizeLabel">20%</span></label>
            <input type="range" id="logoSize" class="control__input" value="0.2" min="0.2" max="0.4" step="0.05">
          </div>
          <div class="control--column">
            <label for="logoMargin" class="control__label">Margem Logo <span id="logoMarginMaxLabel">(max 1 mód.)</span></label>
            <input type="number" id="logoMargin" class="control__input" value="1" min="0" max="1" title="Espaço ao redor do logo. Cada módulo = 8px.">
          </div>
        </div>
      </div>

      <div class="footer-actions">
        <div class="button-group">
          <button id="downloadPNG" class="button button--primary">💾 Baixar PNG</button>
          <button id="downloadSVG" class="button button--secondary">💾 Baixar SVG</button>
          <button id="resetButton" class="button button--danger">🔄 Resetar</button>
        </div>
        <button id="downloadHtmlButton" type="button">Baixar esta página para uso offline</button>
      </div>
    </div>
  </main>

  <div id="toast" class="toast toast--success"></div>

  <script>
    /**
     * @fileoverview Playground interativo para geração e personalização de QR Codes.
     * Utiliza a biblioteca qr-code-styling com suporte a logos, formatos e exportação.
     */

    /** @constant {number} Limite mínimo da margem interna do logo (em módulos) */
    const MIN_LOGO_MARGIN = 0;

    /** @constant {number} Dimensão padrão de cada módulo em pixels */
    const MODULE_SIZE_PX = 8;

    /** @constant {number} Tempo em ms para debounce de digitação e atualização do QR code */
    const DEBOUNCE_DELAY_MS = 100;

    /**
     * @typedef {Object} DefaultConfig
     * @property {string} qrData - Conteúdo padrão do código
     * @property {string} fileName - Nome padrão do arquivo gerado
     * @property {number} marginModules - Margem externa em módulos
     * @property {string} dotType - Formato geométrico dos módulos
     * @property {string} cornerSquareType - Formato dos cantos
     * @property {string} errorCorrection - Nível de correção de erro (L, M, Q, H)
     * @property {string} dotColor - Cor dos módulos em hexadecimal
     * @property {string} bgColor - Cor de fundo em hexadecimal
     * @property {number} logoSize - Proporção de tamanho do logo (0.2 a 0.4)
     * @property {number} logoMargin - Margem interna do logo em módulos
     */
    const defaultValues = {
      qrData: '',
      fileName: '',
      marginModules: 2,
      dotType: 'square',
      cornerSquareType: 'square',
      errorCorrection: 'M',
      dotColor: '#000000',
      bgColor: '#ffffff',
      logoSize: 0.2,
      logoMargin: 1,
    };

    /** @type {string|null} Guarda a URL blob atual do logo para controle de memória */
    let currentLogoBlobUrl = null;

    /** @type {number|null} Identificador do timer de debounce */
    let debounceTimer = null;

    /**
     * Calcula o limite máximo de margem do logo de acordo com a regra de negócio:
     * - Se o tamanho do logo for menor que 40% (< 0.4), o limite máximo é 1 módulo.
     * - Se o tamanho for igual a 40% (0.4), o limite máximo é 3 módulos.
     *
     * @returns {number} Valor máximo de margem (1 ou 3).
     */
    function getMaxLogoMargin() {
      const logoSize = parseFloat(document.getElementById("logoSize").value);
      return (Math.round(logoSize * 100) < 40) ? 1 : 3;
    }

    /**
     * Atualiza as restrições do input de margem do logo (atributo max, rótulo visual e autoajuste de valor).
     */
    function updateLogoMarginLimits() {
      const maxMargin = getMaxLogoMargin();
      const logoMarginInput = document.getElementById("logoMargin");
      const logoMarginMaxLabel = document.getElementById("logoMarginMaxLabel");

      logoMarginInput.max = maxMargin;
      if (logoMarginMaxLabel) {
        logoMarginMaxLabel.textContent = `(max ${maxMargin} mód.)`;
      }

      const currentVal = parseInt(logoMarginInput.value, 10);
      if (!isNaN(currentVal) && currentVal > maxMargin) {
        logoMarginInput.value = maxMargin;
      }
    }

    /**
     * Coleta todos os parâmetros atuais da interface e monta o objeto de opções do QRCodeStyling.
     *
     * @returns {{ opts: Object, marginModules: number }} Opções formatadas para o QRCodeStyling.
     */
    function getOptions() {
      const data = document.getElementById("qrData").value;
      const marginModules = Math.max(0, parseInt(document.getElementById("marginModules").value, 10) || 0);
      const dotType = document.getElementById("dotType").value;
      const cornerSquareType = document.getElementById("cornerSquareType").value;
      const dotColor = document.getElementById("dotColor").value;
      const bgColor = document.getElementById("bgColor").value;
      const errorCorrection = document.getElementById("errorCorrection").value;
      const logoSize = parseFloat(document.getElementById("logoSize").value);
      const maxLogoMargin = getMaxLogoMargin();

      const logoMarginEl = document.getElementById("logoMargin");
      const parsedMargin = parseInt(logoMarginEl.value, 10);
      const logoMargin = isNaN(parsedMargin)
        ? MIN_LOGO_MARGIN
        : Math.min(Math.max(parsedMargin, MIN_LOGO_MARGIN), maxLogoMargin);

      return {
        opts: {
          width: 256,
          height: 256,
          type: "svg",
          data: data || " ",
          image: currentLogoBlobUrl,
          margin: marginModules * MODULE_SIZE_PX,
          qrOptions: {
            errorCorrectionLevel: errorCorrection
          },
          dotsOptions: {
            type: dotType,
            color: dotColor
          },
          cornersSquareOptions: {
            type: cornerSquareType,
            color: dotColor
          },
          cornersDotOptions: {
            type: cornerSquareType === 'extra-rounded' ? 'dot' : (cornerSquareType === 'dot' ? 'dot' : 'square'),
            color: dotColor
          },
          backgroundOptions: {
            color: bgColor
          },
          imageOptions: {
            crossOrigin: "anonymous",
            imageSize: logoSize,
            margin: logoMargin * MODULE_SIZE_PX,
            hideBackgroundDots: true
          }
        },
        marginModules
      };
    }

    /**
     * Atualiza a renderização do QR Code no DOM de forma eficiente e recalcula dimensões no infoBox.
     */
    function updateQRCode() {
      const canvas = document.getElementById("canvas");
      const { opts, marginModules } = getOptions();

      if (!window.qrCode) {
        canvas.innerHTML = '';
        window.qrCode = new QRCodeStyling(opts);
        window.qrCode.append(canvas);
      } else {
        window.qrCode.update(opts);
      }

      setTimeout(() => {
        if (window.qrCode && window.qrCode._qr) {
          const modules = window.qrCode._qr.getModuleCount();
          if (modules > 0) {
            const sizePx = modules * MODULE_SIZE_PX + (marginModules * MODULE_SIZE_PX * 2);
            document.getElementById("infoBox").innerText = `Módulos: ${modules}x${modules} | Tamanho: ${sizePx}px`;
          }
        }
      }, 100);
    }

    /**
     * Executa a atualização do QR Code com debounce para evitar gargalos em digitação rápida.
     */
    function debouncedUpdateQRCode() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(updateQRCode, DEBOUNCE_DELAY_MS);
    }

    /**
     * Gerencia a seleção de um novo arquivo de logo e atualiza as permissões de correção de erro.
     */
    function handleLogoChange() {
      const logoInput = document.getElementById('logoInput');
      const errorCorrectionSelect = document.getElementById('errorCorrection');

      if (currentLogoBlobUrl) {
        URL.revokeObjectURL(currentLogoBlobUrl);
        currentLogoBlobUrl = null;
      }

      if (logoInput.files && logoInput.files[0]) {
        currentLogoBlobUrl = URL.createObjectURL(logoInput.files[0]);
        errorCorrectionSelect.value = 'H';
        errorCorrectionSelect.disabled = true;
      } else {
        errorCorrectionSelect.disabled = false;
      }

      updateQRCode();
    }

    /**
     * Remove o arquivo de logo selecionado e restaura as opções de correção de erro.
     */
    function clearLogo() {
      const logoInput = document.getElementById('logoInput');
      logoInput.value = '';
      if (currentLogoBlobUrl) {
        URL.revokeObjectURL(currentLogoBlobUrl);
        currentLogoBlobUrl = null;
      }
      document.getElementById('errorCorrection').disabled = false;
      updateQRCode();
      showToast('Logo removido');
    }

    /**
     * Exibe um toast temporário com feedback visual para o usuário.
     *
     * @param {string} message - Mensagem a ser exibida.
     */
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    /**
     * Copia a imagem renderizada do QR Code em formato PNG diretamente para a área de transferência.
     */
    async function copyPNGToClipboard() {
      if (!document.getElementById("qrData").value) {
        alert("Por favor, insira um conteúdo para o QR Code antes de copiar.");
        return;
      }
      try {
        const blob = await window.qrCode.getRawData("png");
        if (blob) {
          await navigator.clipboard.write([
            new ClipboardItem({ 'image/png': blob })
          ]);
          showToast('✓ Imagem PNG copiada para a área de transferência!');
        }
      } catch (err) {
        console.error("Falha ao copiar imagem:", err);
        showToast('Não foi possível copiar a imagem automaticamente.');
      }
    }

    /**
     * Copia o código SVG bruto do QR Code para a área de transferência.
     */
    async function copySVGToClipboard() {
      if (!document.getElementById("qrData").value) {
        alert("Por favor, insira um conteúdo para o QR Code antes de copiar.");
        return;
      }
      try {
        const blob = await window.qrCode.getRawData("svg");
        if (blob) {
          const svgText = await blob.text();
          await navigator.clipboard.writeText(svgText);
          showToast('✓ Código SVG copiado para a área de transferência!');
        }
      } catch (err) {
        console.error("Falha ao copiar SVG:", err);
        showToast('Não foi possível copiar o SVG.');
      }
    }

    /**
     * Faz o download do documento HTML completo para permitir execução local offline.
     */
    function downloadHtml() {
      const htmlContent = document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'gerador-qrcode.html';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    }

    /**
     * Registra todos os ouvintes de eventos da página.
     */
    function setupEventListeners() {
      // Inputs gerais acionam atualização com debounce
      document.querySelectorAll("input:not(#logoInput):not(#logoMargin):not(#dotColorHex):not(#bgColorHex), select")
        .forEach(el => el.addEventListener("input", debouncedUpdateQRCode));

      document.getElementById('logoInput').addEventListener('change', handleLogoChange);
      document.getElementById('clearLogoBtn').addEventListener('click', clearLogo);

      updateLogoMarginLimits();

      // Tratamento específico de autoajuste da margem do logo
      const logoMarginInput = document.getElementById('logoMargin');
      logoMarginInput.addEventListener('input', () => {
        if (logoMarginInput.value !== '') {
          const maxMargin = getMaxLogoMargin();
          const val = parseInt(logoMarginInput.value, 10);
          if (!isNaN(val)) {
            if (val > maxMargin) logoMarginInput.value = maxMargin;
            else if (val < MIN_LOGO_MARGIN) logoMarginInput.value = MIN_LOGO_MARGIN;
          }
        }
        debouncedUpdateQRCode();
      });

      logoMarginInput.addEventListener('blur', () => {
        if (logoMarginInput.value === '' || isNaN(parseInt(logoMarginInput.value, 10))) {
          logoMarginInput.value = MIN_LOGO_MARGIN;
          updateQRCode();
        }
      });

      // Sincronização bidirecional de seletores de cor e campos hexadecimais
      ['dotColor', 'bgColor'].forEach(id => {
        const colorPicker = document.getElementById(id);
        const hexInput = document.getElementById(`${id}Hex`);

        colorPicker.addEventListener('input', () => {
          hexInput.value = colorPicker.value;
          debouncedUpdateQRCode();
        });

        hexInput.addEventListener('input', () => {
          let val = hexInput.value.trim();
          if (!val.startsWith('#') && val.length > 0) {
            val = '#' + val;
          }
          if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
            colorPicker.value = val;
            debouncedUpdateQRCode();
          }
        });
      });

      // Slider de tamanho do logo
      const logoSizeSlider = document.getElementById('logoSize');
      const logoSizeLabel = document.getElementById('logoSizeLabel');
      logoSizeSlider.addEventListener('input', () => {
        logoSizeLabel.textContent = `${Math.round(logoSizeSlider.value * 100)}%`;
        updateLogoMarginLimits();
        debouncedUpdateQRCode();
      });

      // Ações de exportação e download
      document.getElementById("downloadPNG").addEventListener("click", () => download('png'));
      document.getElementById("downloadSVG").addEventListener("click", () => download('svg'));
      document.getElementById("copyPNG").addEventListener("click", copyPNGToClipboard);
      document.getElementById("copySVG").addEventListener("click", copySVGToClipboard);
      document.getElementById("resetButton").addEventListener("click", resetAll);
      document.getElementById("downloadHtmlButton").addEventListener("click", downloadHtml);
    }

    /**
     * Realiza o download do arquivo de imagem gerado pelo QRCodeStyling.
     *
     * @param {'png'|'svg'|'jpeg'|'webp'} ext - Extensão do arquivo para exportação.
     */
    function download(ext) {
      if (!document.getElementById("qrData").value) {
        alert("Por favor, insira um conteúdo para o QR Code antes de baixar.");
        return;
      }
      const fileName = document.getElementById("fileName").value.trim() || "qrcode";
      window.qrCode.download({ name: fileName, extension: ext });
    }

    /**
     * Reseta a cor de um seletor específico para o padrão.
     *
     * @param {string} id - Identificador do input de cor.
     * @param {string} color - Código hexadecimal da cor padrão.
     */
    window.resetColor = function(id, color) {
      document.getElementById(id).value = color;
      document.getElementById(`${id}Hex`).value = color;
      updateQRCode();
    };

    /**
     * Restaura todas as configurações da ferramenta para seus valores iniciais.
     */
    function resetAll() {
      if (!confirm("Tem certeza que deseja resetar todas as opções?")) return;

      Object.keys(defaultValues).forEach(key => {
        const el = document.getElementById(key);
        if (el) el.value = defaultValues[key];
      });

      if (currentLogoBlobUrl) {
        URL.revokeObjectURL(currentLogoBlobUrl);
        currentLogoBlobUrl = null;
      }

      document.getElementById('logoInput').value = '';
      document.getElementById('errorCorrection').disabled = false;
      document.getElementById('logoSizeLabel').textContent = `${Math.round(defaultValues.logoSize * 100)}%`;

      updateLogoMarginLimits();

      resetColor('dotColor', defaultValues.dotColor);
      resetColor('bgColor', defaultValues.bgColor);

      updateQRCode();
      showToast('Configurações resetadas');
    }

    // Inicialização da aplicação
    setupEventListeners();
    updateQRCode();
  </script>
</body>
</html>
