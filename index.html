<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerador QR Code Definitivo</title>
  <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0/lib/qr-code-styling.js"></script>
  <style>
    :root {
      --bg-color: #121212;
      --surface-color: #1e1e1e;
      --primary-text-color: #e0e0e0;
      --secondary-text-color: #aaa;
      --border-color: #333;
      --input-bg-color: #2a2a2a;
      --button-primary-bg: #007bff;
      --button-primary-hover: #0056b3;
      --button-secondary-bg: #444;
      --button-secondary-hover: #666;
      --button-danger-bg: #dc3545;
      --button-danger-hover: #c82333;
      --info-bg-color: #2c2c2c;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color );
      color: var(--primary-text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .qr-playground {
      display: flex;
      gap: 32px;
      align-items: stretch; /* Estica os filhos para a mesma altura */
      background-color: var(--surface-color);
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      width: 80vw;
      max-width: 1100px;
      min-width: 900px;
      height: 85vh;
      max-height: 700px;
    }

    .qr-playground__column {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .qr-playground__column--preview {
      gap: 20px;
    }

    .controls-wrapper { display: flex; flex-direction: column; gap: 14px; }

    .qr-playground__preview-area {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-playground__canvas {
      width: 100%;
      max-width: 256px;
      aspect-ratio: 1 / 1;
      background-color: white;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .control { display: flex; flex-direction: column; gap: 6px; }
    .control--row { display: flex; gap: 12px; align-items: flex-end; }
    .control--column { flex: 1; }
    .control__label { font-size: 14px; font-weight: 500; color: var(--secondary-text-color); display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .control__label span:last-child { font-size: 12px; color: #888; }
    .control__input { width: 100%; height: 42px; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background-color: var(--input-bg-color); color: var(--primary-text-color); font-size: 14px; box-sizing: border-box; }
    .control__input:focus { outline: none; border-color: var(--button-primary-bg); }
    .control__input:disabled { background-color: #222; color: #777; cursor: not-allowed; }
    .control__input[type="color"] { padding: 2px; }
    .control__input[type="range"] { padding: 0; }
    .control__input[type="file"] { padding: 4px; }

    .color-preset { height: 42px; padding: 0 10px; font-size: 12px; background: #3a3a3a; border: 1px solid var(--border-color); color: #ccc; border-radius: 6px; cursor: pointer; transition: background-color 0.2s; }
    .color-preset:hover { background-color: #4a4a4a; }

    .button-group { display: flex; gap: 12px; }
    .button { flex: 1; padding: 12px; border-radius: 6px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: background-color 0.2s ease; }
    .button--primary { background-color: var(--button-primary-bg); color: #ffffff; }
    .button--primary:hover { background-color: var(--button-primary-hover); }
    .button--secondary { background-color: var(--button-secondary-bg); color: #ffffff; }
    .button--secondary:hover { background-color: var(--button-secondary-hover); }
    .button--danger { background-color: var(--button-danger-bg); color: #ffffff; }
    .button--danger:hover { background-color: var(--button-danger-hover); }

    .info-box { flex: 1; font-size: 13px; color: var(--secondary-text-color); padding: 10px 12px; background-color: var(--info-bg-color); border: 1px solid var(--border-color); border-radius: 6px; text-align: center; height: 42px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; }

    .footer-actions { text-align: center; margin-top: 10px; }
    #downloadHtmlButton { background: none; border: none; color: var(--secondary-text-color); font-size: 12px; text-decoration: underline; cursor: pointer; }
    #downloadHtmlButton:hover { color: var(--primary-text-color); }
  </style>
</head>
<body>

  <main class="qr-playground">
    <!-- Coluna de Conteúdo e Preview -->
    <div class="qr-playground__column qr-playground__column--preview">
        <h2 style="margin: 0;">Playground QR Code</h2>

      <div class="controls-wrapper">
        <div class="control">
          <label for="fileName" class="control__label">Nome do arquivo de saída</label>
          <input type="text" id="fileName" class="control__input" placeholder="ex: meu-qrcode-evento">
        </div>

        <div class="control">
          <label for="qrData" class="control__label">Conteúdo do QR Code (URL ou Texto)</label>
          <input type="text" id="qrData" class="control__input" placeholder="https://seusite.com">
        </div>
      </div>

      <div class="qr-playground__preview-area">
        <div id="canvas" class="qr-playground__canvas"></div>
      </div>
    </div>

    <!-- Coluna de Controles de Personalização -->
    <div class="qr-playground__column">
      <div class="controls-wrapper">
        <h2 style="margin: 0;">Personalização</h2>

        <div class="control--row">
          <div class="control--column">
            <label for="marginModules" class="control__label">Margem (módulos)</label>
            <input type="number" id="marginModules" class="control__input" value="2" min="0" title="Espaço em branco ao redor. Cada módulo = 8px.">
          </div>
          <div class="info-box" id="infoBox">Módulos: -- | Tamanho: -- px</div>
        </div>

        <div class="control--row">
          <div class="control--column">
            <label for="dotType" class="control__label">Formato</label>
            <select id="dotType" class="control__input">
              <option value="square">Quadrado</option>
              <option value="dots">Pontos</option>
              <option value="rounded">Arredondado</option>
              <option value="classy-rounded">Classy Arredondado</option>
              <option value="extra-rounded">Extra Arredondado</option>
            </select>
          </div>
          <div class="control--column">
            <label for="errorCorrection" class="control__label">Correção de Erro</label>
            <select id="errorCorrection" class="control__input" title="Níveis mais altos (Q, H) permitem leitura mesmo com o código danificado ou com um logo.">
              <option value="L">Baixa (L)</option>
              <option value="M" selected>Média (M)</option>
              <option value="Q">Alta (Q)</option>
              <option value="H">Máxima (H)</option>
            </select>
          </div>
        </div>

        <div class="control--row">
          <div class="control--column">
            <label class="control__label">Cor Módulos</label>
            <div class="control--row">
              <input type="color" id="dotColor" class="control__input" value="#000000">
              <input type="text" id="dotColorHex" class="control__input" value="#000000">
              <button class="color-preset" onclick="resetColor('dotColor', '#000000')">Padrão</button>
            </div>
          </div>
          <div class="control--column">
            <label class="control__label">Cor Fundo</label>
            <div class="control--row">
              <input type="color" id="bgColor" class="control__input" value="#ffffff">
              <input type="text" id="bgColorHex" class="control__input" value="#ffffff">
              <button class="color-preset" onclick="resetColor('bgColor', '#ffffff')">Padrão</button>
            </div>
          </div>
        </div>

        <div class="control">
          <label for="logoInput" class="control__label">Logo (Opcional)</label>
          <input type="file" id="logoInput" class="control__input" accept="image/png, image/jpeg, image/svg+xml">
        </div>

        <div class="control--row" id="logoOptions">
          <div class="control--column">
            <label for="logoSize" class="control__label">Tamanho Logo <span id="logoSizeLabel">20%</span></label>
            <input type="range" id="logoSize" class="control__input" value="0.2" min="0.1" max="0.4" step="0.05">
          </div>
          <div class="control--column">
            <label for="logoMargin" class="control__label">Margem Logo (mód.)</label>
            <input type="number" id="logoMargin" class="control__input" value="1" min="0" title="Espaço ao redor do logo. Cada módulo = 8px.">
          </div>
        </div>
      </div>

      <div class="footer-actions">
        <div class="button-group">
          <button id="downloadPNG" class="button button--primary">Baixar PNG</button>
          <button id="downloadSVG" class="button button--secondary">Baixar SVG</button>
          <button id="resetButton" class="button button--danger">Resetar</button>
        </div>
        <button id="downloadHtmlButton">Baixar esta página para uso offline</button>
      </div>
    </div>
  </main>

  <script>
    const MODULE_SIZE_PX = 8;
    const defaultValues = {
      qrData: '', fileName: '', marginModules: 2, dotType: 'square',
      errorCorrection: 'M', dotColor: '#000000', bgColor: '#ffffff',
      logoSize: 0.2, logoMargin: 1,
    };

    function getOptions( ) {
      const data = document.getElementById("qrData").value;
      const marginModules = parseInt(document.getElementById("marginModules").value);
      const dotType = document.getElementById("dotType").value;
      const dotColor = document.getElementById("dotColor").value;
      const bgColor = document.getElementById("bgColor").value;
      const errorCorrection = document.getElementById("errorCorrection").value;
      const logoInput = document.getElementById("logoInput").files[0];
      const logoSize = parseFloat(document.getElementById("logoSize").value);
      const logoMargin = parseInt(document.getElementById("logoMargin").value);

      return {
        opts: {
          width: 256, height: 256, type: "svg", data: data || " ",
          image: logoInput ? URL.createObjectURL(logoInput) : null,
          margin: marginModules * MODULE_SIZE_PX,
          qrOptions: { errorCorrectionLevel: errorCorrection },
          dotsOptions: { type: dotType, color: dotColor },
          backgroundOptions: { color: bgColor },
          imageOptions: { crossOrigin: "anonymous", imageSize: logoSize, margin: logoMargin * MODULE_SIZE_PX }
        },
        marginModules
      };
    }

    function updateQRCode() {
      const canvas = document.getElementById("canvas");
      canvas.innerHTML = '';
      if (window.qrCode && window.qrCode._options.image) {
        URL.revokeObjectURL(window.qrCode._options.image);
      }

      const { opts, marginModules } = getOptions();
      window.qrCode = new QRCodeStyling(opts);
      window.qrCode.append(canvas);

      setTimeout(() => {
        if (window.qrCode && window.qrCode._qr) {
          const modules = window.qrCode._qr.getModuleCount();
          if (modules > 0) {
            const sizePx = modules * MODULE_SIZE_PX + (marginModules * MODULE_SIZE_PX * 2);
            document.getElementById("infoBox").innerText = `Módulos: ${modules}x${modules} | Tamanho: ${sizePx}px`;
          }
        }
      }, 150);
    }

    function handleLogoChange() {
      const logoInput = document.getElementById('logoInput');
      const errorCorrectionSelect = document.getElementById('errorCorrection');
      if (logoInput.files.length > 0) {
        errorCorrectionSelect.value = 'H';
        errorCorrectionSelect.disabled = true;
      } else {
        errorCorrectionSelect.disabled = false;
      }
      updateQRCode();
    }

    function downloadHtml() {
      const htmlContent = document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'gerador-qrcode.html';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    }

    function setupEventListeners() {
      document.querySelectorAll("input:not(#logoInput), select").forEach(el => el.addEventListener("input", updateQRCode));
      document.getElementById('logoInput').addEventListener('change', handleLogoChange);

      ['dotColor', 'bgColor'].forEach(id => {
        const colorPicker = document.getElementById(id);
        const hexInput = document.getElementById(`${id}Hex`);
        colorPicker.addEventListener('input', () => hexInput.value = colorPicker.value);
        hexInput.addEventListener('input', () => {
          if (/^#[0-9A-F]{6}$/i.test(hexInput.value)) {
            colorPicker.value = hexInput.value;
            updateQRCode();
          }
        });
      });

      const logoSizeSlider = document.getElementById('logoSize');
      const logoSizeLabel = document.getElementById('logoSizeLabel');
      logoSizeSlider.addEventListener('input', () => {
        logoSizeLabel.textContent = `${Math.round(logoSizeSlider.value * 100)}%`;
      });

      document.getElementById("downloadPNG").addEventListener("click", () => download('png'));
      document.getElementById("downloadSVG").addEventListener("click", () => download('svg'));
      document.getElementById("resetButton").addEventListener("click", resetAll);
      document.getElementById("downloadHtmlButton").addEventListener("click", downloadHtml);
    }

    function download(ext) {
      if (!document.getElementById("qrData").value) {
        alert("Por favor, insira um conteúdo para o QR Code antes de baixar.");
        return;
      }
      const fileName = document.getElementById("fileName").value || "qrcode";
      window.qrCode.download({ name: fileName, extension: ext });
    }

    window.resetColor = function(id, color) {
      document.getElementById(id).value = color;
      document.getElementById(`${id}Hex`).value = color;
      updateQRCode();
    }

    function resetAll() {
      if (!confirm("Tem certeza que deseja resetar todas as opções?")) return;
      Object.keys(defaultValues).forEach(key => {
        const el = document.getElementById(key);
        if (el) el.value = defaultValues[key];
      });

      document.getElementById('logoInput').value = '';
      document.getElementById('errorCorrection').disabled = false;
      document.getElementById('logoSizeLabel').textContent = `${Math.round(defaultValues.logoSize * 100)}%`;

      resetColor('dotColor', defaultValues.dotColor);
      resetColor('bgColor', defaultValues.bgColor);

      updateQRCode();
    }

    setupEventListeners();
    updateQRCode();
  </script>
</body>
</html>
